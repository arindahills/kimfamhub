name: Deploy KimFam Hub

# Every push deploys to staging and runs tests.
# On main + green tests → promote to prod.
# On failure → Claude diagnoses + fixes on Hetzner staging, notifies Hillary on WhatsApp.
# No auto-commits or auto-pushes to GitHub. Hillary reviews the fix and pushes manually.

on:
  push:
    branches: ["**"]

env:
  HETZNER_HOST: 89.167.121.193
  HETZNER_USER: root
  STAGING_DIR:  /var/www/kimfamhub-staging
  PROD_DIR:     /var/www/kimfamhub
  STAGING_URL:  https://staging.kimfamhub.com
  VENV:         /var/www/kimfamhub/venv/bin

jobs:
  # ── Deploy to staging ────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HETZNER_HOST >> ~/.ssh/known_hosts

      - name: Rsync code to staging
        run: |
          rsync -az --delete \
            --exclude='.env' --exclude='venv/' --exclude='__pycache__/' \
            --exclude='*.db' --exclude='.git/' --exclude='data/' \
            --exclude='service-account.json' --exclude='.service-account.json' \
            --exclude='static/avatars/' --exclude='static/receipts/' \
            --exclude='static/expenditures/' --exclude='static/project-pics/' \
            --exclude='docs/minutes/' --exclude='docs/financial/' \
            --exclude='docs/receipts/' --exclude='docs/projects/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ $HETZNER_USER@$HETZNER_HOST:$STAGING_DIR/

      - name: Promote React index + assets to staging root
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $HETZNER_USER@$HETZNER_HOST \
            "cp $STAGING_DIR/frontend/dist/index.html $STAGING_DIR/index.html && \
             cp $STAGING_DIR/frontend/dist/favicon.svg $STAGING_DIR/favicon.svg 2>/dev/null || true && \
             cp $STAGING_DIR/frontend/dist/icons.svg $STAGING_DIR/icons.svg 2>/dev/null || true"

      - name: Restart staging service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $HETZNER_USER@$HETZNER_HOST \
            "systemctl restart kimfamhub-staging && sleep 4"

      - name: Wait for staging to be healthy
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" $STAGING_URL/ || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 3
          done
          echo "Staging did not become healthy in time"
          exit 1

  # ── Unit tests (run on Hetzner, output captured) ─────────────────────────────
  unit-tests:
    name: Unit Tests (on Hetzner)
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HETZNER_HOST >> ~/.ssh/known_hosts

      - name: Run pytest on staging
        id: pytest
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $HETZNER_USER@$HETZNER_HOST \
            "cd $STAGING_DIR && \
             KIMFAM_APP_ROOT=$STAGING_DIR \
             $VENV/pytest tests/test_api.py -v --tb=short 2>&1" \
            | tee /tmp/unit_output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Upload unit test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: /tmp/unit_output.txt
          retention-days: 1

      - name: Fail job if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  # ── Smoke tests (network, from CI runner) ────────────────────────────────────
  smoke-tests:
    name: Smoke Tests (network)
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Run smoke tests against staging
        id: smoke
        env:
          SMOKE_BASE_URL: ${{ env.STAGING_URL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
        run: |
          pytest tests/test_smoke.py -v --tb=short 2>&1 | tee /tmp/smoke_output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: /tmp/smoke_output.txt
          retention-days: 1

      - name: Fail job if smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

  # ── Playwright frontend tests (React app end-to-end) ─────────────────────────
  frontend-tests:
    name: Frontend Tests (Playwright)
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright + deps
        run: |
          pip install pytest pytest-playwright playwright
          playwright install chromium --with-deps

      - name: Run Playwright tests against staging
        id: playwright
        env:
          SMOKE_BASE_URL: ${{ env.STAGING_URL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          PLAYWRIGHT_HEADLESS: "1"
        run: |
          pytest tests/test_frontend.py -v --tb=short 2>&1 | tee /tmp/frontend_output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Upload frontend test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-output
          path: /tmp/frontend_output.txt
          retention-days: 1

      - name: Fail job if frontend tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1

  # ── Self-heal: Claude diagnoses + fixes on Hetzner, notifies Hillary ─────────
  # NO auto-commit or auto-push. Claude fixes files on staging only.
  # Hillary reviews, pulls locally, and pushes when satisfied.
  self-heal:
    name: Self-Heal (Claude — no auto-push)
    runs-on: ubuntu-latest
    needs: [unit-tests, smoke-tests, frontend-tests]
    if: |
      always() &&
      (needs.unit-tests.result == 'failure' || needs.smoke-tests.result == 'failure' || needs.frontend-tests.result == 'failure')
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HETZNER_HOST >> ~/.ssh/known_hosts

      - name: Download unit test output
        uses: actions/download-artifact@v4
        with:
          name: unit-test-output
          path: /tmp
        continue-on-error: true

      - name: Download smoke test output
        uses: actions/download-artifact@v4
        with:
          name: smoke-test-output
          path: /tmp
        continue-on-error: true

      - name: Copy failure logs to Hetzner and run self-heal (Claude CLI)
        id: heal
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/unit_output.txt /tmp/smoke_output.txt \
            $HETZNER_USER@$HETZNER_HOST:/tmp/ 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $HETZNER_USER@$HETZNER_HOST \
            "cd $STAGING_DIR && python3 scripts/self_heal.py \
              --unit-log /tmp/unit_output.txt \
              --smoke-log /tmp/smoke_output.txt"
        continue-on-error: true

      - name: Notify Hillary on WhatsApp
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "${{ steps.heal.outcome }}" = "success" ]; then
            MSG="KimFam CI: tests failed on branch $BRANCH. Claude fixed them on staging. Pull from Hetzner and push when ready:\n\nrsync -az --exclude='.env' --exclude='venv/' --exclude='__pycache__/' --exclude='*.db' --exclude='.git/' root@89.167.121.193:$STAGING_DIR/ ./"
          else
            MSG="KimFam CI: tests failed on branch $BRANCH and self-heal could not fix them. Manual review needed. Check CI logs."
          fi
          curl -s -X POST "http://localhost:8080/api/send" \
            -H "Content-Type: application/json" \
            -d "{\"recipient\": \"256775102684\", \"message\": \"$MSG\"}" || true

  # ── Promote to prod (only when tests pass, no self-heal in this run) ─────────
  promote-to-prod:
    name: Promote → Production
    runs-on: ubuntu-latest
    needs: [unit-tests, smoke-tests, frontend-tests]
    if: |
      success() &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HETZNER_HOST >> ~/.ssh/known_hosts

      - name: Rsync code + built dist to prod
        run: |
          rsync -az --delete \
            --exclude='.env' --exclude='venv/' --exclude='__pycache__/' \
            --exclude='*.db' --exclude='.git/' --exclude='data/' \
            --exclude='service-account.json' --exclude='.service-account.json' \
            --exclude='static/avatars/' --exclude='static/receipts/' \
            --exclude='static/expenditures/' --exclude='static/project-pics/' \
            --exclude='docs/minutes/' --exclude='docs/financial/' \
            --exclude='docs/receipts/' --exclude='docs/projects/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ $HETZNER_USER@$HETZNER_HOST:$PROD_DIR/

      - name: Promote React index + assets to prod root
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $HETZNER_USER@$HETZNER_HOST \
            "cp $PROD_DIR/frontend/dist/index.html $PROD_DIR/index.html && \
             cp $PROD_DIR/frontend/dist/favicon.svg $PROD_DIR/favicon.svg 2>/dev/null || true && \
             cp $PROD_DIR/frontend/dist/icons.svg $PROD_DIR/icons.svg 2>/dev/null || true"

      - name: Restart prod service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $HETZNER_USER@$HETZNER_HOST \
            "systemctl restart kimfamhub && sleep 4"

      - name: Verify prod is healthy
        run: |
          sleep 5
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://kimfamhub.com/ || echo "000")
          echo "Prod health check: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1
