name: Deploy KimFam Hub

# Every push deploys to staging and runs tests.
# On main + green tests → promote to prod.
# On failure → self-heal loop (Claude fixes code, commits, re-triggers pipeline).
# Loop guard: stop self-healing after 3 consecutive [auto-fix] commits.

on:
  push:
    branches: ["**"]

env:
  HETZNER_HOST: 89.167.121.193
  HETZNER_USER: root
  STAGING_DIR:  /var/www/kimfamhub-staging
  PROD_DIR:     /var/www/kimfamhub
  STAGING_URL:  https://staging.kimfamhub.com
  VENV:         /var/www/kimfamhub/venv/bin

jobs:
  # ── Loop guard ───────────────────────────────────────────────────────────────
  # Count consecutive [auto-fix] commits at HEAD. If 3 or more, abort everything.
  guard:
    name: Loop Guard
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      fix_count:  ${{ steps.check.outputs.fix_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Count recent auto-fix commits
        id: check
        run: |
          COUNT=0
          for SHA in $(git log --format="%H" -5); do
            MSG=$(git log --format="%s" -1 "$SHA")
            if echo "$MSG" | grep -q "\[auto-fix"; then
              COUNT=$((COUNT+1))
            else
              break
            fi
          done
          echo "fix_count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -ge 10 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Self-heal loop limit reached ($COUNT consecutive auto-fix commits). Manual intervention required."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Deploy to staging ────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HETZNER_HOST >> ~/.ssh/known_hosts

      - name: Rsync code to staging
        run: |
          rsync -az --delete \
            --exclude='.env' --exclude='venv/' --exclude='__pycache__/' \
            --exclude='*.db' --exclude='.git/' --exclude='data/' \
            --exclude='static/avatars/' --exclude='static/receipts/' \
            --exclude='static/expenditures/' --exclude='static/project-pics/' \
            --exclude='docs/minutes/' --exclude='docs/financial/' \
            --exclude='docs/receipts/' --exclude='docs/projects/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ $HETZNER_USER@$HETZNER_HOST:$STAGING_DIR/

      - name: Restart staging service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $HETZNER_USER@$HETZNER_HOST \
            "systemctl restart kimfamhub-staging && sleep 4"

      - name: Wait for staging to be healthy
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" $STAGING_URL/ || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 3
          done
          echo "Staging did not become healthy in time"
          exit 1

  # ── Unit tests (run on Hetzner, output captured) ─────────────────────────────
  unit-tests:
    name: Unit Tests (on Hetzner)
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HETZNER_HOST >> ~/.ssh/known_hosts

      - name: Run pytest on staging
        id: pytest
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $HETZNER_USER@$HETZNER_HOST \
            "cd $STAGING_DIR && \
             KIMFAM_APP_ROOT=$STAGING_DIR \
             $VENV/pytest tests/test_api.py -v --tb=short 2>&1" \
            | tee /tmp/unit_output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Upload unit test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: /tmp/unit_output.txt
          retention-days: 1

      - name: Fail job if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1

  # ── Smoke tests (network, from CI runner) ────────────────────────────────────
  smoke-tests:
    name: Smoke Tests (network)
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Run smoke tests against staging
        id: smoke
        env:
          SMOKE_BASE_URL: ${{ env.STAGING_URL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
        run: |
          pytest tests/test_smoke.py -v --tb=short 2>&1 | tee /tmp/smoke_output.txt
          exit ${PIPESTATUS[0]}
        continue-on-error: true

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: /tmp/smoke_output.txt
          retention-days: 1

      - name: Fail job if smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

  # ── Self-heal: Claude fixes failing tests and re-pushes ──────────────────────
  self-heal:
    name: Self-Heal (Claude)
    runs-on: ubuntu-latest
    needs: [guard, unit-tests, smoke-tests]
    if: |
      always() &&
      needs.guard.outputs.should_run == 'true' &&
      (needs.unit-tests.result == 'failure' || needs.smoke-tests.result == 'failure')
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 5

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HETZNER_HOST >> ~/.ssh/known_hosts

      - name: Download unit test output
        uses: actions/download-artifact@v4
        with:
          name: unit-test-output
          path: /tmp
        continue-on-error: true

      - name: Download smoke test output
        uses: actions/download-artifact@v4
        with:
          name: smoke-test-output
          path: /tmp
        continue-on-error: true

      - name: Copy failure logs to Hetzner and run self-heal (Claude CLI)
        id: heal
        run: |
          # Upload logs to Hetzner where Claude Code CLI is authenticated
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/unit_output.txt /tmp/smoke_output.txt \
            $HETZNER_USER@$HETZNER_HOST:/tmp/ 2>/dev/null || true

          # Run self_heal.py on Hetzner staging dir (uses `claude -p` subprocess)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $HETZNER_USER@$HETZNER_HOST \
            "cd $STAGING_DIR && python3 scripts/self_heal.py \
              --unit-log /tmp/unit_output.txt \
              --smoke-log /tmp/smoke_output.txt"
        continue-on-error: true

      - name: Rsync fixed files back from Hetzner to runner checkout
        if: steps.heal.outcome == 'success'
        run: |
          rsync -az \
            --exclude='.env' --exclude='venv/' --exclude='__pycache__/' \
            --exclude='*.db' --exclude='.git/' --exclude='data/' \
            --exclude='static/avatars/' --exclude='static/receipts/' \
            --exclude='static/expenditures/' --exclude='static/project-pics/' \
            --exclude='docs/minutes/' --exclude='docs/financial/' \
            --exclude='docs/receipts/' --exclude='docs/projects/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            $HETZNER_USER@$HETZNER_HOST:$STAGING_DIR/ ./

      - name: Commit and push fixes
        if: steps.heal.outcome == 'success'
        run: |
          FIX_NUM=$(( ${{ needs.guard.outputs.fix_count }} + 1 ))
          git config user.name  "KimFam CI Bot"
          git config user.email "ci@kimfamhub.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "[auto-fix attempt $FIX_NUM] Claude self-heal: fix failing CI tests"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Notify if heal failed
        if: steps.heal.outcome != 'success'
        run: |
          echo "::error::Self-heal failed — Claude could not produce a fix. Manual intervention required."
          exit 1

  # ── Promote to prod (only when tests pass, no self-heal in this run) ─────────
  promote-to-prod:
    name: Promote → Production
    runs-on: ubuntu-latest
    needs: [unit-tests, smoke-tests]
    if: |
      success() &&
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build React frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $HETZNER_HOST >> ~/.ssh/known_hosts

      - name: Rsync code + built dist to prod
        run: |
          rsync -az --delete \
            --exclude='.env' --exclude='venv/' --exclude='__pycache__/' \
            --exclude='*.db' --exclude='.git/' --exclude='data/' \
            --exclude='static/avatars/' --exclude='static/receipts/' \
            --exclude='static/expenditures/' --exclude='static/project-pics/' \
            --exclude='docs/minutes/' --exclude='docs/financial/' \
            --exclude='docs/receipts/' --exclude='docs/projects/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ $HETZNER_USER@$HETZNER_HOST:$PROD_DIR/

      - name: Restart prod service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $HETZNER_USER@$HETZNER_HOST \
            "systemctl restart kimfamhub && sleep 4"

      - name: Verify prod is healthy
        run: |
          sleep 5
          STATUS=$(curl -sk -o /dev/null -w "%{http_code}" https://kimfamhub.com/ || echo "000")
          echo "Prod health check: HTTP $STATUS"
          [ "$STATUS" = "200" ] || exit 1
